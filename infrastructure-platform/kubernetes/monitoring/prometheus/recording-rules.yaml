apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-recording-rules
  namespace: monitoring
spec:
  groups:
    - name: platform.rules
      interval: 30s

      rules:

        - record: cluster:pod_count
          expr: |
            count(kube_pod_info)

        - record: cluster:node_count
          expr: |
            count(kube_node_info)

        - record: cluster:running_pods
          expr: |
            count(
              kube_pod_status_phase{
                phase="Running"
              }
            )

        - record: cluster:pending_pods
          expr: |
            count(
              kube_pod_status_phase{
                phase="Pending"
              }
            )

        - record: cluster:cpu_requests
          expr: |
            sum(
              kube_pod_container_resource_requests{
                resource="cpu"
              }
            )

        - record: cluster:memory_requests
          expr: |
            sum(
              kube_pod_container_resource_requests{
                resource="memory"
              }
            )