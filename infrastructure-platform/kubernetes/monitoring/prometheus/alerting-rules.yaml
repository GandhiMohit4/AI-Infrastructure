apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
spec:
  groups:

    - name: kubernetes.availability

      rules:

        - alert: PodCrashLooping
          expr: |
            increase(
              kube_pod_container_status_restarts_total[15m]
            ) > 3

          for: 10m

          labels:
            severity: warning

          annotations:
            summary: "Pod is repeatedly restarting"
            description: |
              Pod {{ $labels.namespace }}/{{ $labels.pod }}
              has restarted repeatedly.


        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true"
            } == 0

          for: 5m

          labels:
            severity: critical

          annotations:
            summary: "Kubernetes node is not ready"


        - alert: PendingPods
          expr: |
            sum(
              kube_pod_status_phase{
                phase="Pending"
              }
            ) > 5

          for: 10m

          labels:
            severity: warning

          annotations:
            summary: "Large number of pending pods"


    - name: kubernetes.resources

      rules:

        - alert: HighMemory
          expr: |
            (
              1 -
              node_memory_MemAvailable_bytes /
              node_memory_MemTotal_bytes
            ) > 0.90

          for: 10m

          labels:
            severity: warning

          annotations:
            summary: "Node memory utilization above 90%"


        - alert: HighCPU
          expr: |
            (
              1 -
              avg by(instance) (
                rate(
                  node_cpu_seconds_total{
                    mode="idle"
                  }[5m]
                )
              )
            ) > 0.85

          for: 10m

          labels:
            severity: warning

          annotations:
            summary: "Node CPU utilization above 85%"