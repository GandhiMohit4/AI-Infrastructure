prometheus:
  prometheusSpec:

    retention: 15d

    resources:
      requests:
        cpu: 500m
        memory: 1Gi

      limits:
        cpu: 2
        memory: 4Gi

    serviceMonitorSelectorNilUsesHelmValues: false

    podMonitorSelectorNilUsesHelmValues: false


grafana:
  enabled: true

  adminUser: admin

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 500m
      memory: 512Mi


alertmanager:
  enabled: true


nodeExporter:
  enabled: true


kubeStateMetrics:
  enabled: true