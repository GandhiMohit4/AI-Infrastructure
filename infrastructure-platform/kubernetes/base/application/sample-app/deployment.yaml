apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: application
  labels:
    app: sample-app
    app.kubernetes.io/component: application
    app.kubernetes.io/name: sample-app

spec:
  replicas: 5

  selector:
    matchLabels:
      app: sample-app
      app.kubernetes.io/component: application
      app.kubernetes.io/name: sample-app

  template:
    metadata:
      labels:
        app: sample-app
        app.kubernetes.io/component: application
        app.kubernetes.io/name: sample-app
        
    spec:
      serviceAccountName: sample-app

      containers:

        # --------------------------------------------------
        # NGINX
        # --------------------------------------------------
        - name: nginx
          image: nginx:1.31.5
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: sample-app-config-map

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

        # --------------------------------------------------
        # NGINX PROMETHEUS EXPORTER
        # --------------------------------------------------
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          imagePullPolicy: IfNotPresent

          args:
            - "--nginx.scrape-uri=http://127.0.0.1:80/nginx_status"

          ports:
            - name: metrics
              containerPort: 9113

          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

      # --------------------------------------------------
      # NGINX CONFIGURATION
      # --------------------------------------------------
      volumes:
        - name: nginx-config
          configMap:
            name: sample-app-nginx-config