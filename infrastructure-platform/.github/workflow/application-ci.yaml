name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate dev overlay
        run: |
          kubectl kustomize kubernetes/overlays/dev > /tmp/dev-manifests.yaml

      - name: Validate production overlay
        run: |
          kubectl kustomize kubernetes/overlays/production > /tmp/production-manifests.yaml