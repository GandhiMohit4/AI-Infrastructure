name: Application CI

on:
  pull_request:
    paths:
      - "infrastructure-platform/kubernetes/base/application/**"

  push:
    branches:
      - main
    paths:
      - "infrastructure-platform/kubernetes/base/application/**"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sample-app

jobs:
  build:
    name: Build Application Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: infrastructure-platform/kubernetes/base/application/sample-app
        run: |
          docker build \
            -t ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}